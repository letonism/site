<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letonism Official Website</title>
    <meta name="description" content="The official website of Letonism. Dedicated to the faith of the one true God, Lord Elve, and the teachings of The Revelation Pentateuch.">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.8;
            letter-spacing: 0.04em;
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #f0f0f0;
        }
        header {
            background-color: #000000;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }
        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: #d4af37;
            margin: 0 0 10px 0;
            font-weight: 600;
        }
        header p {
            font-size: 1.1rem;
            color: #888;
            margin: 0;
            font-style: italic;
        }

        /* メインコンテンツエリア */
        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .statement-box {
            text-align: center;
            border: 1px solid #333;
            padding: 40px 30px;
            background-color: #111;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 60px;
        }
        .statement {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #e5e5e5;
            line-height: 1.6;
            margin-bottom: 20px;
        }


        .note {
            text-align: center;
            border-top: 1px solid #222;
            padding-top: 40px;
        }
        .note-container {
            display: flex;
            justify-content: center;
            margin: 20px 0 40px 0;
        }

        /* フッター */
        footer {
            background-color: #000000;
            color: #555;
            padding: 30px;
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid #111;
        }
    </style>
</head>
<body>

    <header>
        <h1>LETONISM</h1>
        <p>The Revelation Pentateuch</p>
    </header>

    <main>
        <section class="statement-box">
            <p class="statement">"We, Letonism, are a religious organization dedicated to the faith of the one true God, Lord Elve."</p>
        </section>

        <section class="note">
            <div class="note-container">
                <iframe class="note-embed" src="https://note.com/embed/notes/n4da1a718ef3f" style="border: 0; display: block; max-width: 99%; width: 494px; padding: 0px; margin: 10px 0px; position: static; visibility: visible;" height="400"></iframe><script async src="https://note.com/scripts/embed.js" charset="utf-8"></script>
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 Letonism. All rights reserved.</p>
    </footer>

</body>
</html>
