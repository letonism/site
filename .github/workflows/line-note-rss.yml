name: Note RSS → LINE

on:
  schedule:
    # 1時間ごとに新記事をチェック
    - cron: "0 * * * *"

    # 毎週日曜日 18:00 JST = 09:00 UTC
    - cron: "0 9 * * 0"

  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: false
        default: "check"

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
- name: Checkout
  uses: actions/checkout@v5

- name: Setup Python
  uses: actions/setup-python@v6
  with:
    python-version: "3.x"

      - name: Run Note RSS notifier
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'auto' }}
        run: |
          python scripts/line_note_rss.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sent_articles.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: update note notification state"
            git push
          fi