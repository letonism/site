<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Letoniu Calendar Converter</title>

<style>
    :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --card: #ffffff;
        --text: #171717;
        --muted: #666;
        --border: #d8d8dc;
        --accent: #3949ab;
        --accent-hover: #303f9f;
        --error: #b3261e;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #111216;
            --card: #1b1c21;
            --text: #f1f1f1;
            --muted: #aaa;
            --border: #383a42;
            --accent: #7986cb;
            --accent-hover: #9fa8da;
            --error: #ff8a80;
        }
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
    }

    main {
        width: min(680px, 100%);
    }

    h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 42px);
        line-height: 1.15;
    }

    .subtitle {
        color: var(--muted);
        margin: 0 0 28px;
        line-height: 1.6;
    }

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    label {
        display: block;
        font-weight: 650;
        margin-bottom: 8px;
    }

    input[type="date"] {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 16px;
    }

    button {
        width: 100%;
        margin-top: 14px;
        padding: 13px 16px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: var(--accent-hover);
    }

    button:focus-visible,
    input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
    }

    .result {
        margin-top: 22px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 12px;
        min-height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: clamp(20px, 5vw, 30px);
        font-weight: 750;
        line-height: 1.4;
    }

    .result.error {
        color: var(--error);
        font-size: 16px;
        font-weight: 600;
    }

    .details {
        margin-top: 12px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
    }

    footer {
        margin-top: 22px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
    }
</style>
</head>

<body>

<main>
    <h1>Letoniu Calendar Converter</h1>

    <p class="subtitle">
        Convert a Gregorian date into the Letoniu Calendar.
    </p>

    <section class="card">
        <label for="gregorian-date">
            Gregorian date
        </label>

        <input
            id="gregorian-date"
            type="date"
            aria-label="Gregorian date"
        >

        <button
            id="convert-letoniu"
            type="button"
        >
            Convert
        </button>

        <div
            id="letoniu-result"
            class="result"
            aria-live="polite"
        >
            Select a date and press Convert.
        </div>

        <div
            id="letoniu-details"
            class="details"
            aria-live="polite"
        ></div>
    </section>

    <footer>
        The Letoniu Calendar begins on September 10, 6,998,027 B.C.
        (proleptic Gregorian calendar), which is Year 1, Month 1, Day 1.
        It has twelve 30-day months followed by the Great Holy Days.
    </footer>
</main>

<script>
"use strict";

/*
 * Letoniu Calendar Converter
 *
 * Epoch:
 * September 10, 6,998,027 B.C.
 * = Letoniu Year 1, Month 1, Day 1
 *
 * Calendar structure:
 *
 * - 12 months
 * - 30 days per month
 * - 360 regular days
 * - Great Holy Days follow the 12 months
 *
 * Great Holy Days:
 *
 * - Normally: 5 days
 * - Every 4th year: 6 days
 * - Every 128th year: 5 days
 * - Every 3,320th year: 5 days
 * - Every 250,000th year: 6 days
 *
 * Special rules:
 *
 * - The 128-year rule overrides the ordinary
 *   4-year leap-year rule.
 *
 * - The 3,320-year rule overrides the ordinary
 *   4-year leap-year rule.
 *
 * - If a year is divisible by both 128 and 3,320,
 *   it still has 5 Great Holy Days.
 *
 * - The 250,000-year rule gives 6 Great Holy Days.
 *   Because 250,000 is divisible by 4, its six days
 *   are already represented by the ordinary leap-year
 *   calculation.
 */


/*
 * Convert a proleptic Gregorian calendar date
 * to an integer day number.
 *
 * Astronomical year numbering is used internally:
 *
 * 1 B.C.  = year 0
 * 2 B.C.  = year -1
 * ...
 *
 * Therefore:
 *
 * 6,998,027 B.C. = astronomical year -6,998,026
 *
 * The returned value is relative to 1970-01-01.
 */
function daysFromCivil(year, month, day) {
    year -= month <= 2 ? 1 : 0;

    const era = Math.floor(
        (year >= 0 ? year : year - 399) / 400
    );

    const yearOfEra =
        year - era * 400;

    const monthPrime =
        month + (month > 2 ? -3 : 9);

    const dayOfYear =
        Math.floor(
            (153 * monthPrime + 2) / 5
        ) + day - 1;

    const dayOfEra =
        yearOfEra * 365 +
        Math.floor(yearOfEra / 4) -
        Math.floor(yearOfEra / 100) +
        dayOfYear;

    return (
        era * 146097 +
        dayOfEra -
        719468
    );
}


/*
 * Letoniu Calendar epoch.
 *
 * September 10, 6,998,027 B.C.
 * = astronomical year -6,998,026
 */
const LETONIU_EPOCH = daysFromCivil(
    -6998026,
    9,
    10
);


/*
 * Determine whether a Letoniu year is an
 * ordinary 4-year leap year.
 */
function isLetoniuLeapYear(year) {
    return year % 4 === 0;
}


/*
 * Determine the number of Great Holy Days
 * in a Letoniu year.
 *
 * Priority:
 *
 * 1. 250,000-year rule
 * 2. 128-year rule
 * 3. 3,320-year rule
 * 4. ordinary 4-year leap-year rule
 * 5. ordinary year
 */
function getGreatHolyDays(year) {

    /*
     * Every 250,000th year has six
     * Great Holy Days.
     */
    if (year % 250000 === 0) {
        return 6;
    }

    /*
     * Every 128th year has five
     * Great Holy Days.
     */
    if (year % 128 === 0) {
        return 5;
    }

    /*
     * Every 3,320th year has five
     * Great Holy Days.
     */
    if (year % 3320 === 0) {
        return 5;
    }

    /*
     * Ordinary leap years have six
     * Great Holy Days.
     */
    if (isLetoniuLeapYear(year)) {
        return 6;
    }

    /*
     * Ordinary years have five
     * Great Holy Days.
     */
    return 5;
}


/*
 * Return the total number of days in
 * a Letoniu year.
 */
function getLetoniuYearLength(year) {
    return 360 + getGreatHolyDays(year);
}


/*
 * Return the number of days before
 * the beginning of a given Letoniu year.
 *
 * Year 1 begins at day 0.
 *
 * For n = year - 1:
 *
 * Base:
 *   365 days × n
 *
 * Ordinary leap years:
 *   + floor(n / 4)
 *
 * 128-year special years:
 *   - floor(n / 128)
 *
 * 3,320-year special years:
 *   - floor(n / 3,320)
 *
 * Overlap between 128 and 3,320:
 *   + floor(n / 212,480)
 *
 * Why 212,480?
 *
 * It is the least common multiple of
 * 128 and 3,320.
 *
 * The 250,000-year rule requires no
 * additional correction because 250,000
 * is divisible by 4. Therefore those years
 * already receive the ordinary +1 leap day.
 */
function daysBeforeLetoniuYear(year) {

    if (year <= 1) {
        return 0;
    }

    const n = year - 1;

    let total = n * 365;

    /*
     * Ordinary 4-year leap years.
     */
    total += Math.floor(n / 4);

    /*
     * 128-year special rule.
     */
    total -= Math.floor(n / 128);

    /*
     * 3,320-year special rule.
     */
    total -= Math.floor(n / 3320);

    /*
     * Restore the double subtraction
     * where both special rules coincide.
     *
     * LCM(128, 3320) = 212,480.
     */
    total += Math.floor(n / 212480);

    return total;
}


/*
 * Find the Letoniu year containing a
 * particular day offset.
 *
 * Binary search is used so that dates
 * millions of years away from the epoch
 * can still be converted efficiently.
 */
function findLetoniuYear(dayOffset) {

    let low = 1;

    /*
     * Every Letoniu year is at least
     * 365 days long, so this is a safe
     * initial upper bound.
     */
    let high =
        Math.floor(dayOffset / 365) + 1;

    while (low < high) {

        const middle =
            Math.floor(
                (low + high + 1) / 2
            );

        if (
            daysBeforeLetoniuYear(middle)
            <= dayOffset
        ) {
            low = middle;
        } else {
            high = middle - 1;
        }
    }

    return low;
}


/*
 * Convert a Gregorian date to a
 * Letoniu Calendar date.
 */
function convertGregorianToLetoniu(
    year,
    month,
    day
) {

    const gregorianDay =
        daysFromCivil(
            year,
            month,
            day
        );

    const dayOffset =
        gregorianDay -
        LETONIU_EPOCH;

    /*
     * Dates before the epoch cannot be
     * represented in the Letoniu Calendar.
     */
    if (dayOffset < 0) {
        throw new RangeError(
            "This date is before the beginning of the Letoniu Calendar."
        );
    }

    /*
     * Determine the Letoniu year.
     */
    const letOnIuYear =
        findLetoniuYear(dayOffset);

    /*
     * Determine the day within that year.
     */
    const dayOfYear =
        dayOffset -
        daysBeforeLetoniuYear(
            letOnIuYear
        );

    /*
     * Determine the number of Great Holy Days
     * for the current year.
     */
    const greatHolyDays =
        getGreatHolyDays(
            letOnIuYear
        );

    /*
     * Days 1-360 are the twelve months.
     */
    if (dayOfYear < 360) {

        return {
            year: letOnIuYear,

            month:
                Math.floor(
                    dayOfYear / 30
                ) + 1,

            day:
                (dayOfYear % 30) + 1,

            greatHolyDay: null,

            greatHolyDays:
                greatHolyDays
        };
    }

    /*
     * Days after Day 360 are the
     * Great Holy Days.
     */
    return {
        year: letOnIuYear,

        month: null,

        day: null,

        greatHolyDay:
            dayOfYear - 359,

        greatHolyDays:
            greatHolyDays
    };
}


/*
 * Format a Letoniu date for display.
 */
function formatLetoniuDate(result) {

    if (
        result.greatHolyDay !== null
    ) {
        return (
            "Year " +
            result.year +
            ", Great Holy Day " +
            result.greatHolyDay
        );
    }

    return (
        "Year " +
        result.year +
        ", Month " +
        result.month +
        ", Day " +
        result.day
    );
}


/*
 * Initialise the browser interface.
 */
function initialiseLetoniuConverter() {

    const input =
        document.getElementById(
            "gregorian-date"
        );

    const button =
        document.getElementById(
            "convert-letoniu"
        );

    const output =
        document.getElementById(
            "letoniu-result"
        );

    const details =
        document.getElementById(
            "letoniu-details"
        );

    /*
     * Stop safely if the required
     * elements do not exist.
     */
    if (
        !input ||
        !button ||
        !output ||
        !details
    ) {
        return;
    }


    /*
     * Convert button.
     */
    button.addEventListener(
        "click",
        function () {

            output.classList.remove(
                "error"
            );

            details.textContent = "";


            try {

                /*
                 * Require a date.
                 */
                if (!input.value) {
                    throw new Error(
                        "Please select a Gregorian date."
                    );
                }


                /*
                 * Parse YYYY-MM-DD.
                 */
                const parts =
                    input.value
                        .split("-")
                        .map(Number);

                const year =
                    parts[0];

                const month =
                    parts[1];

                const day =
                    parts[2];


                /*
                 * Convert the date.
                 */
                const result =
                    convertGregorianToLetoniu(
                        year,
                        month,
                        day
                    );


                /*
                 * Display the result.
                 */
                output.textContent =
                    formatLetoniuDate(
                        result
                    );


                /*
                 * Display information about
                 * the Great Holy Days.
                 */
                details.textContent =
                    "This year has " +
                    result.greatHolyDays +
                    " Great Holy Days.";

            } catch (error) {

                /*
                 * Display errors.
                 */
                output.textContent =
                    error.message ||
                    "Conversion failed.";

                output.classList.add(
                    "error"
                );
            }
        }
    );
}


/*
 * Start the converter after the
 * document has loaded.
 */
if (
    document.readyState === "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initialiseLetoniuConverter
    );

} else {

    initialiseLetoniuConverter();
}
</script>

</body>
</html>
