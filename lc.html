<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Letoniu Calendar Converter</title>

<style>
    :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --card: #ffffff;
        --text: #171717;
        --muted: #666;
        --border: #d8d8dc;
        --accent: #3949ab;
        --accent-hover: #303f9f;
        --error: #b3261e;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #111216;
            --card: #1b1c21;
            --text: #f1f1f1;
            --muted: #aaa;
            --border: #383a42;
            --accent: #7986cb;
            --accent-hover: #9fa8da;
            --error: #ff8a80;
        }
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
    }

    main {
        width: min(680px, 100%);
    }

    h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 42px);
        line-height: 1.15;
    }

    .subtitle {
        color: var(--muted);
        margin: 0 0 28px;
        line-height: 1.6;
    }

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    label {
        display: block;
        font-weight: 650;
        margin-bottom: 8px;
    }

    input[type="date"] {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 16px;
    }

    button {
        width: 100%;
        margin-top: 14px;
        padding: 13px 16px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: var(--accent-hover);
    }

    button:focus-visible,
    input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
    }

    .result {
        margin-top: 22px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 12px;
        min-height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: clamp(20px, 5vw, 30px);
        font-weight: 750;
        line-height: 1.4;
    }

    .result.error {
        color: var(--error);
        font-size: 16px;
        font-weight: 600;
    }

    .details {
        margin-top: 12px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
    }

    footer {
        margin-top: 22px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
    }
</style>
</head>

<body>

<main>
    <h1>Letoniu Calendar Converter</h1>

    <p class="subtitle">
        Convert a Gregorian date into the Letoniu Calendar.
    </p>

    <section class="card">
        <label for="gregorian-date">
            Gregorian date
        </label>

        <input
            id="gregorian-date"
            type="date"
            aria-label="Gregorian date"
        >

        <button
            id="convert-letoniu"
            type="button"
        >
            Convert
        </button>

        <div
            id="letoniu-result"
            class="result"
            aria-live="polite"
        >
            Select a date and press Convert.
        </div>

        <div
            id="letoniu-details"
            class="details"
            aria-live="polite"
        ></div>
    </section>

    <footer>
        The Letoniu Calendar begins on September 10, 6,998,027 B.C.
        (proleptic Gregorian calendar), which is Year 1, Month 1, Day 1.
        It has twelve 30-day months followed by the Great Holy Days.
    </footer>
</main>

<script>
"use strict";

/*
 * Letoniu Calendar Converter
 *
 * Epoch:
 * September 10, 6,998,027 B.C.
 * = Letoniu Year 1, Month 1, Day 1
 *
 * Calendar structure:
 * - 12 months
 * - 30 days per month
 * - 360 regular days
 * - Great Holy Days follow the 12 months
 *
 * Great Holy Days:
 * - Normally: 5 days
 * - Every 4th year: 6 days
 * - Every 128th year: 5 days
 * - Every 3,320th year: 5 days
 * - Every 250,000th year: 6 days
 *
 * Special rules:
 * - The 128-year rule overrides the ordinary
 *   4-year leap-year rule.
 * - The 3,320-year rule overrides the ordinary
 *   4-year leap-year rule.
 * - The 250,000-year rule has priority over
 *   the 128-year and 3,320-year rules.
 */


/*
 * Convert a proleptic Gregorian calendar date
 * to an integer day number.
 *
 * Astronomical year numbering is used internally:
 *
 * 1 B.C. = year 0
 * 2 B.C. = year -1
 *
 * Therefore:
 *
 * 6,998,027 B.C. = astronomical year -6,998,026
 */
function daysFromCivil(year, month, day) {

    year -= month <= 2 ? 1 : 0;

    /*
     * FIX: this must truncate toward zero, not floor.
     * The (year - 399)/400 trick emulates C-style truncating
     * division; Math.floor() rounds toward -Infinity instead,
     * which silently shifts every date before astronomical
     * year 0 (1 B.C.) one day earlier than it should be —
     * including this calendar's own epoch, which sits deep
     * in negative territory.
     */
    const era = Math.trunc(
        (year >= 0 ? year : year - 399) / 400
    );

    const yearOfEra =
        year - era * 400;

    const monthPrime =
        month + (month > 2 ? -3 : 9);

    const dayOfYear =
        Math.floor(
            (153 * monthPrime + 2) / 5
        ) + day - 1;

    const dayOfEra =
        yearOfEra * 365 +
        Math.floor(yearOfEra / 4) -
        Math.floor(yearOfEra / 100) +
        dayOfYear;

    return (
        era * 146097 +
        dayOfEra -
        719468
    );
}


/*
 * Letoniu Calendar epoch.
 *
 * September 10, 6,998,027 B.C.
 * = astronomical year -6,998,026
 */
const LETONIU_EPOCH = daysFromCivil(
    -6998026,
    9,
    10
);


/*
 * Ordinary 4-year leap year.
 */
function isLetoniuLeapYear(year) {
    return year % 4 === 0;
}


/*
 * Return the number of Great Holy Days
 * in a Letoniu year.
 *
 * Priority:
 * 1. 250,000-year rule
 * 2. 128-year rule
 * 3. 3,320-year rule
 * 4. ordinary 4-year leap-year rule
 * 5. ordinary year
 */
function getGreatHolyDays(year) {

    if (year % 250000 === 0) {
        return 6;
    }

    if (year % 128 === 0) {
        return 5;
    }

    if (year % 3320 === 0) {
        return 5;
    }

    if (isLetoniuLeapYear(year)) {
        return 6;
    }

    return 5;
}


/*
 * Return the total number of days
 * in a Letoniu year.
 */
function getLetoniuYearLength(year) {
    return 360 + getGreatHolyDays(year);
}


/*
 * Return the number of days before
 * the beginning of a given Letoniu year.
 *
 * Year 1 begins at day 0.
 *
 * This is a closed-form (inclusion-exclusion) version of
 * summing getGreatHolyDays(y) - 5 for y = 1..year-1, honoring
 * the same priority order as getGreatHolyDays():
 * 250,000-year rule > 128-year rule > 3,320-year rule >
 * ordinary 4-year leap rule.
 *
 * For n = year - 1:
 *
 * 365 × n
 * + floor(n / 4)                  ordinary leap-bonus candidates
 * - floor(n / 128)                lose bonus: 128-year rule
 * - floor(n / 3320)               lose bonus: 3,320-year rule
 * + floor(n / 53,120)             128 & 3,320 both apply (bonus lost once, not twice)
 * + floor(n / 2,000,000)          128 & 250,000 both apply (250,000 restores the bonus)
 * + floor(n / 20,750,000)         3,320 & 250,000 both apply (ditto)
 * - floor(n / 166,000,000)        128 & 3,320 & 250,000 all apply (correct for double add above)
 *
 * FIX: the original code used 212,480 as "the LCM of 128 and
 * 3,320" — that is wrong; the true LCM is 53,120
 * (gcd(128, 3320) = 8, so lcm = 128 × 3320 / 8 = 53,120). Using
 * 212,480 applied the correction 4x too rarely. The original
 * code also never accounted for the 250,000-year rule's
 * interaction with the 128-year and 3,320-year rules at all, even
 * though getGreatHolyDays() gives the 250,000-year rule top
 * priority. Both omissions are far from theoretical: today's
 * Letoniu year (~7,000,064) has already passed the 53,120-year
 * boundary about 130 times and the 2,000,000-year boundary
 * (lcm(128, 250000)) once, so the original formula's cumulative
 * error is already about -102 days as of today, not something
 * that only shows up in the deep future.
 */
function daysBeforeLetoniuYear(year) {

    if (year <= 1) {
        return 0;
    }

    const n = year - 1;

    let total = n * 365;

    total += Math.floor(n / 4);

    total -= Math.floor(n / 128);

    total -= Math.floor(n / 3320);

    total += Math.floor(n / 53120);

    total += Math.floor(n / 2000000);

    total += Math.floor(n / 20750000);

    total -= Math.floor(n / 166000000);

    return total;
}


/*
 * Find the Letoniu year containing
 * a particular day offset.
 */
function findLetoniuYear(dayOffset) {

    let low = 1;

    let high =
        Math.floor(dayOffset / 365) + 1;

    while (low < high) {

        const middle =
            Math.floor(
                (low + high + 1) / 2
            );

        if (
            daysBeforeLetoniuYear(middle)
            <= dayOffset
        ) {
            low = middle;
        } else {
            high = middle - 1;
        }
    }

    return low;
}


/*
 * Convert a Gregorian date
 * to a Letoniu Calendar date.
 */
function convertGregorianToLetoniu(
    year,
    month,
    day
) {

    const gregorianDay =
        daysFromCivil(
            year,
            month,
            day
        );

    const dayOffset =
        gregorianDay -
        LETONIU_EPOCH;

    if (dayOffset < 0) {
        throw new RangeError(
            "This date is before the beginning of the Letoniu Calendar."
        );
    }

    const letoniuYear =
        findLetoniuYear(dayOffset);

    const dayOfYear =
        dayOffset -
        daysBeforeLetoniuYear(
            letoniuYear
        );

    const greatHolyDays =
        getGreatHolyDays(
            letoniuYear
        );

    /*
     * Days 1-360 are the twelve months.
     */
    if (dayOfYear < 360) {

        return {
            year: letoniuYear,

            month:
                Math.floor(
                    dayOfYear / 30
                ) + 1,

            day:
                (dayOfYear % 30) + 1,

            greatHolyDay: null,

            greatHolyDays:
                greatHolyDays
        };
    }

    /*
     * Days after Day 360 are
     * the Great Holy Days.
     */
    return {
        year: letoniuYear,

        month: null,

        day: null,

        greatHolyDay:
            dayOfYear - 359,

        greatHolyDays:
            greatHolyDays
    };
}


/*
 * Format a Letoniu date for display.
 */
function formatLetoniuDate(result) {

    if (
        result.greatHolyDay !== null
    ) {
        return (
            "Year " +
            result.year +
            ", Great Holy Day " +
            result.greatHolyDay
        );
    }

    return (
        "Year " +
        result.year +
        ", Month " +
        result.month +
        ", Day " +
        result.day
    );
}


/*
 * Initialise the browser interface.
 */
function initialiseLetoniuConverter() {

    const input =
        document.getElementById(
            "gregorian-date"
        );

    const button =
        document.getElementById(
            "convert-letoniu"
        );

    const output =
        document.getElementById(
            "letoniu-result"
        );

    const details =
        document.getElementById(
            "letoniu-details"
        );

    button.addEventListener(
        "click",
        function () {

            output.classList.remove(
                "error"
            );

            details.textContent = "";

            if (!input.value) {

                output.textContent =
                    "Please select a Gregorian date.";

                output.classList.add(
                    "error"
                );

                return;
            }

            const parts =
                input.value.split("-");

            const year =
                Number(parts[0]);

            const month =
                Number(parts[1]);

            const day =
                Number(parts[2]);

            try {

                const result =
                    convertGregorianToLetoniu(
                        year,
                        month,
                        day
                    );

                output.textContent =
                    formatLetoniuDate(result);

                details.textContent =
                    "Great Holy Days in this year: " +
                    result.greatHolyDays;

            } catch (error) {

                output.textContent =
                    error.message;

                output.classList.add(
                    "error"
                );
            }
        }
    );
}


/*
 * Start the converter.
 */
document.addEventListener(
    "DOMContentLoaded",
    initialiseLetoniuConverter
);
</script>

</body>
</html>
